<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Departments — BizPermit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/theme.css">
  <link rel="stylesheet" href="/assets/css/global.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/animations.css">
</head>
<body>
  <div class="dashboard-wrapper">
    <aside id="dashboard-sidebar" class="dashboard-sidebar"></aside>
    <div class="dashboard-main">
      <header id="dashboard-topbar" class="dashboard-topbar"></header>
      <main class="dashboard-content">
        <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:1rem;margin-bottom:2rem;">
          <div>
            <span style="font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--text-muted);">Municipal Structure</span>
            <h1 style="font-size:1.875rem;margin-top:0.25rem;">Departments</h1>
            <p style="color:var(--text-secondary);">Manage municipal departments that handle license adjudication.</p>
          </div>
          <button class="btn btn-primary btn-sm" onclick="openDeptModal()">
            <span class="material-symbols-outlined" style="font-size:15px;">add</span> Add Department
          </button>
        </div>

        <div id="dept-loading" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1.5rem;">
          <div style="height:140px;border-radius:12px;background:var(--bg-secondary);animation:pulse 1.5s infinite;"></div>
          <div style="height:140px;border-radius:12px;background:var(--bg-secondary);animation:pulse 1.5s infinite;"></div>
          <div style="height:140px;border-radius:12px;background:var(--bg-secondary);animation:pulse 1.5s infinite;"></div>
        </div>
        <div id="dept-empty" style="display:none;padding:4rem;text-align:center;background:#fff;border-radius:12px;border:1px solid var(--border-default);">
          <span class="material-symbols-outlined" style="font-size:48px;color:var(--text-muted);display:block;margin-bottom:1rem;">account_balance</span>
          <h3 style="font-size:1.1rem;">No departments found</h3>
        </div>
        <div id="dept-grid" style="display:none;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1.5rem;"></div>
      </main>
    </div>
  </div>

  <div id="dept-modal" class="modal-overlay" style="display:none;">
    <div class="modal-box" style="max-width:480px;">
      <div class="modal-header">
        <h3 id="modal-title" style="font-size:1rem;font-weight:700;">Add Department</h3>
        <button class="modal-close" onclick="closeDeptModal()">&times;</button>
      </div>
      <div class="modal-body">
        <form id="dept-form">
          <div class="form-group">
            <label class="form-label" for="dept-name">Department Name *</label>
            <input type="text" id="dept-name" class="form-control" required placeholder="e.g. Commerce & Industry">
          </div>
          <div class="form-group">
            <label class="form-label" for="dept-code">Department Code *</label>
            <input type="text" id="dept-code" class="form-control" required placeholder="e.g. COMM" style="text-transform:uppercase;">
          </div>
          <div class="form-group">
            <label class="form-label" for="dept-head">Head of Department</label>
            <input type="text" id="dept-head" class="form-control" placeholder="Name of HOD">
          </div>
          <div class="form-group">
            <label class="form-label" for="dept-email">Contact Email</label>
            <input type="email" id="dept-email" class="form-control" placeholder="dept@municipality.gov">
          </div>
          <div class="form-group">
            <label class="form-label" for="dept-phone">Contact Phone</label>
            <input type="text" id="dept-phone" class="form-control" placeholder="+91 9876543210">
          </div>
          <div class="form-group">
            <label class="form-label" for="dept-sla">SLA Days</label>
            <input type="number" id="dept-sla" class="form-control" placeholder="30" min="1" max="365">
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeDeptModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveDept()" id="dept-save-btn">Save Department</button>
      </div>
    </div>
  </div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/components.js"></script>
  <script>
    let editDeptId = null;
    document.addEventListener('DOMContentLoaded', async () => {
      await requireAuth('ADMIN');
      renderSidebar('departments','ADMIN');
      renderTopbar();
      await loadDepts();
      document.querySelectorAll('.modal-overlay').forEach(o => o.addEventListener('click', e => { if(e.target===o) closeDeptModal(); }));
    });

    async function loadDepts() {
      try {
        const res = await api.get('/api/admin/departments');
        document.getElementById('dept-loading').style.display = 'none';
        const depts = res.success ? (res.data || []) : [];
        if (!depts.length) { document.getElementById('dept-empty').style.display = 'block'; return; }
        document.getElementById('dept-grid').style.display = 'grid';
        document.getElementById('dept-grid').innerHTML = depts.map(d => `
          <div class="card" style="padding:1.5rem;">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1rem;">
              <div style="width:44px;height:44px;background:var(--bg-obsidian);color:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;">
                <span class="material-symbols-outlined" style="font-size:22px;">account_balance</span>
              </div>
              <div style="display:flex;gap:0.5rem;">
                <button class="btn btn-secondary btn-sm" onclick="openDeptModal(${JSON.stringify(d).replace(/"/g,'&quot;')})" title="Edit">
                  <span class="material-symbols-outlined" style="font-size:14px;">edit</span>
                </button>
              </div>
            </div>
            <div style="font-weight:800;font-size:1rem;font-family:var(--font-heading);margin-bottom:0.25rem;">${d.name}</div>
            <div style="font-size:0.75rem;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:0.08em;">${d.code}</div>
            <div style="margin-top:1rem;display:flex;flex-direction:column;gap:0.4rem;">
              ${d.head_of_department ? `<div style="font-size:0.8rem;"><span class="material-symbols-outlined" style="font-size:14px;vertical-align:middle;color:var(--text-muted);">person</span> ${d.head_of_department}</div>` : ''}
              ${d.contact_email ? `<div style="font-size:0.8rem;"><span class="material-symbols-outlined" style="font-size:14px;vertical-align:middle;color:var(--text-muted);">mail</span> ${d.contact_email}</div>` : ''}
              ${d.sla_days ? `<div style="font-size:0.8rem;"><span class="material-symbols-outlined" style="font-size:14px;vertical-align:middle;color:var(--text-muted);">schedule</span> SLA: ${d.sla_days} days</div>` : ''}
            </div>
          </div>`).join('');
      } catch(e) {
        document.getElementById('dept-loading').style.display = 'none';
        document.getElementById('dept-empty').style.display = 'block';
      }
    }

    function openDeptModal(dept) {
      editDeptId = dept ? dept.id : null;
      document.getElementById('modal-title').textContent = dept ? 'Edit Department' : 'Add Department';
      document.getElementById('dept-name').value = dept?.name || '';
      document.getElementById('dept-code').value = dept?.code || '';
      document.getElementById('dept-head').value = dept?.head_of_department || '';
      document.getElementById('dept-email').value = dept?.contact_email || '';
      document.getElementById('dept-phone').value = dept?.contact_phone || '';
      document.getElementById('dept-sla').value = dept?.sla_days || '';
      document.getElementById('dept-modal').style.display = 'flex';
    }

    function closeDeptModal() {
      document.getElementById('dept-modal').style.display = 'none';
      document.getElementById('dept-form').reset();
      editDeptId = null;
    }

    async function saveDept() {
      const name = document.getElementById('dept-name').value.trim();
      const code = document.getElementById('dept-code').value.trim().toUpperCase();
      if (!name || !code) { showToast('Name and code are required.', 'warning'); return; }
      const btn = document.getElementById('dept-save-btn');
      btn.disabled = true;
      try {
        const payload = { name, code, headOfDepartment: document.getElementById('dept-head').value, contactEmail: document.getElementById('dept-email').value, contactPhone: document.getElementById('dept-phone').value, slaDays: parseInt(document.getElementById('dept-sla').value)||30 };
        const res = editDeptId ? await api.put('/api/admin/departments/' + editDeptId, payload) : await api.post('/api/admin/departments', payload);
        if (res.success) { showToast(editDeptId ? 'Department updated.' : 'Department created.', 'success'); closeDeptModal(); await loadDepts(); }
        else throw new Error(res.error?.message);
      } catch(e) { showToast(e.message || 'Failed.', 'error'); }
      finally { btn.disabled = false; }
    }
  </script>
</body>
</html>
