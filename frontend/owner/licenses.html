<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Licenses — BizPermit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/theme.css">
  <link rel="stylesheet" href="/assets/css/animations.css">
  <link rel="stylesheet" href="/assets/css/global.css">
  <link rel="stylesheet" href="/assets/css/components.css">
</head>
<body>
  <div class="dashboard-wrapper">
    <aside id="dashboard-sidebar" class="dashboard-sidebar"></aside>
    <div class="dashboard-main">
      <header id="dashboard-topbar" class="dashboard-topbar"></header>
      <main class="dashboard-content">
        <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:1rem;margin-bottom:2.5rem;">
          <div>
            <span style="font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--text-muted);">Issued Permits</span>
            <h1 style="font-size:1.875rem;margin-top:0.25rem;">My Licenses</h1>
            <p style="color:var(--text-secondary);">Active, expiring, and historical permits across all your businesses.</p>
          </div>
        </div>

        <!-- Status Tabs -->
        <div style="display:flex;gap:0.5rem;margin-bottom:1.5rem;border-bottom:1px solid var(--border-default);padding-bottom:0;">
          <button class="tab-btn active" data-filter="all" onclick="setTab(this,'all')">All</button>
          <button class="tab-btn" data-filter="ACTIVE" onclick="setTab(this,'ACTIVE')">Active</button>
          <button class="tab-btn" data-filter="EXPIRING" onclick="setTab(this,'EXPIRING')">Expiring Soon</button>
          <button class="tab-btn" data-filter="EXPIRED" onclick="setTab(this,'EXPIRED')">Expired</button>
          <button class="tab-btn" data-filter="REVOKED" onclick="setTab(this,'REVOKED')">Revoked</button>
        </div>

        <div id="lic-loading" style="padding:3rem;text-align:center;">
          <div style="height:80px;margin-bottom:1rem;border-radius:10px;background:var(--bg-secondary);animation:pulse 1.5s infinite;"></div>
          <div style="height:80px;border-radius:10px;background:var(--bg-secondary);animation:pulse 1.5s infinite;"></div>
        </div>
        <div id="lic-empty" style="display:none;padding:5rem;text-align:center;">
          <span class="material-symbols-outlined" style="font-size:56px;color:var(--text-muted);display:block;margin-bottom:1rem;">workspace_premium</span>
          <h3 style="font-size:1.2rem;margin-bottom:0.5rem;">No licenses yet</h3>
          <p style="color:var(--text-secondary);">Licenses appear here once your application is approved and a permit is issued.</p>
          <a href="/owner/apply.html" class="btn btn-primary" style="margin-top:1.5rem;">Apply for a License</a>
        </div>
        <div id="lic-grid" style="display:none;"></div>
      </main>
    </div>
  </div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/components.js"></script>
  <script>
    let allLicenses = [];
    let currentFilter = 'all';

    document.addEventListener('DOMContentLoaded', async () => {
      await requireAuth('OWNER');
      renderSidebar('licenses','OWNER');
      renderTopbar();
      await loadLicenses();
    });

    function setTab(btn, filter) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = filter;
      renderLicenses(allLicenses);
    }

    async function loadLicenses() {
      try {
        const res = await api.get('/api/licenses');
        document.getElementById('lic-loading').style.display = 'none';
        allLicenses = res.success ? (res.data || []) : [];
        renderLicenses(allLicenses);
      } catch(e) {
        document.getElementById('lic-loading').style.display = 'none';
        document.getElementById('lic-empty').style.display = 'block';
      }
    }

    function renderLicenses(licenses) {
      const now = new Date();
      const soon = new Date(now.getTime() + 30*24*60*60*1000);

      let filtered = licenses.map(l => {
        const expiry = new Date(l.expiry_date || l.expiryDate);
        let displayStatus = l.status || l.licenseStatus || 'ACTIVE';
        if (displayStatus === 'ACTIVE' && expiry < now) displayStatus = 'EXPIRED';
        if (displayStatus === 'ACTIVE' && expiry < soon) displayStatus = 'EXPIRING';
        return { ...l, displayStatus, expiry };
      });

      if (currentFilter !== 'all') {
        filtered = filtered.filter(l => l.displayStatus === currentFilter);
      }

      if (!filtered.length) {
        document.getElementById('lic-empty').style.display = 'block';
        document.getElementById('lic-grid').style.display = 'none';
        return;
      }
      document.getElementById('lic-empty').style.display = 'none';
      document.getElementById('lic-grid').style.display = 'grid';
      document.getElementById('lic-grid').style.cssText = 'display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:1.5rem;';

      const stMap = {
        ACTIVE:{cls:'badge-success',label:'Active'},
        EXPIRING:{cls:'badge-warning',label:'Expiring Soon'},
        EXPIRED:{cls:'badge-error',label:'Expired'},
        REVOKED:{cls:'badge-error',label:'Revoked'}
      };

      document.getElementById('lic-grid').innerHTML = filtered.map(l => {
        const issuedDate = l.issue_date || l.issueDate;
        const expiryDate = l.expiry_date || l.expiryDate;
        const total = (new Date(expiryDate) - new Date(issuedDate)) / (1000*60*60*24);
        const elapsed = (new Date() - new Date(issuedDate)) / (1000*60*60*24);
        const pct = Math.min(100, Math.max(0, Math.round((elapsed/total)*100)));
        const st = stMap[l.displayStatus] || {cls:'',label:l.displayStatus};
        const daysLeft = Math.ceil((new Date(expiryDate)-new Date())/(1000*60*60*24));
        const barColor = l.displayStatus==='ACTIVE'?'var(--state-success)': l.displayStatus==='EXPIRING'?'var(--state-warning)':'var(--state-error)';

        return `<div class="lic-card">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1rem;">
            <div>
              <div style="font-size:0.65rem;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--text-muted);margin-bottom:0.25rem;">LICENSE NUMBER</div>
              <div style="font-family:var(--font-heading);font-weight:800;font-size:1rem;">${l.license_number || l.licenseNumber || '—'}</div>
            </div>
            <span class="badge ${st.cls}">${st.label}</span>
          </div>
          <div style="font-size:1.05rem;font-weight:700;margin-bottom:0.5rem;">${l.license_type_name || l.licenseTypeName || '—'}</div>
          <div style="font-size:0.8rem;color:var(--text-secondary);margin-bottom:1rem;">${l.business_name || l.businessName || '—'}</div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem;font-size:0.8rem;margin-bottom:0.75rem;">
            <div><div style="color:var(--text-muted);font-size:0.7rem;font-weight:600;text-transform:uppercase;margin-bottom:2px;">Issued</div><div style="font-weight:600;">${issuedDate ? new Date(issuedDate).toLocaleDateString('en-IN') : '—'}</div></div>
            <div><div style="color:var(--text-muted);font-size:0.7rem;font-weight:600;text-transform:uppercase;margin-bottom:2px;">Expires</div><div style="font-weight:600;">${expiryDate ? new Date(expiryDate).toLocaleDateString('en-IN') : '—'}</div></div>
          </div>
          <div class="expiry-bar"><div class="expiry-bar-fill" style="width:${pct}%;background:${barColor};"></div></div>
          <div style="font-size:0.7rem;color:var(--text-muted);margin-bottom:1.25rem;">${daysLeft > 0 ? daysLeft + ' days remaining' : 'Expired'}</div>
          <div style="display:flex;gap:0.75rem;">
            <a href="/owner/license-certificate.html?id=${l.id}" class="btn btn-secondary btn-sm" style="flex:1;justify-content:center;display:flex;align-items:center;gap:6px;">
              <span class="material-symbols-outlined" style="font-size:15px;">workspace_premium</span> Certificate
            </a>
            ${l.displayStatus==='ACTIVE'||l.displayStatus==='EXPIRING'?`<a href="/owner/renew.html?id=${l.id}" class="btn btn-primary btn-sm" style="flex:1;justify-content:center;display:flex;align-items:center;gap:6px;">
              <span class="material-symbols-outlined" style="font-size:15px;">autorenew</span> Renew
            </a>`:''}
          </div>
        </div>`;
      }).join('');
    }
  </script>
</body>
</html>
