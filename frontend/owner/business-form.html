<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Business Profile Form — BizPermit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"><link rel="stylesheet" href="/assets/css/theme.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"><link rel="stylesheet" href="/assets/css/global.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"><link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/animations.css">
</head>
<body>

  <div class="dashboard-wrapper">
    <aside id="dashboard-sidebar" class="dashboard-sidebar"></aside>

    <div class="dashboard-main">
      <header id="dashboard-topbar" class="dashboard-topbar"></header>

      <main class="dashboard-content">
        
        <div style="max-width: 760px; margin: 0 auto;">
          <div style="margin-bottom: 2rem;">
            <a href="/owner/businesses.html" style="display: inline-flex; align-items: center; gap: 6px; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.75rem;">
              <span class="material-symbols-outlined" style="font-size: 16px;">arrow_back</span>
              <span>Back to Businesses</span>
            </a>
            <h1 id="page-heading" style="font-size: 2rem; margin-bottom: 0.25rem;">Register Commercial Entity</h1>
            <p>Enter certified address and statutory classification details for municipal zoning record.</p>
          </div>

          <div class="card" style="padding: 2.5rem;">
            <form id="business-form" onsubmit="handleSubmit(event)">
              <div class="form-group">
                <label class="form-label required">Business Commercial Name</label>
                <input type="text" id="business-name" class="form-control" required placeholder="e.g. Hearthstone Coffee Roasters LLC">
              </div>

              <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem;">
                <div class="form-group">
                  <label class="form-label required">Commercial Sector</label>
                  <select id="category-id" class="form-select" required>
                    <option value="">Select Primary Activity</option>
                  </select>
                </div>

                <div class="form-group">
                  <label class="form-label">Business Registration / Tax Number</label>
                  <input type="text" id="registration-number" class="form-control" placeholder="e.g. REG-2026-9041 (Optional)">
                </div>
              </div>

              <div class="form-group">
                <label class="form-label required">Physical Street Address (Premises Line 1)</label>
                <input type="text" id="address-line1" class="form-control" required placeholder="Street number and name">
              </div>

              <div class="form-group">
                <label class="form-label">Premises Line 2 (Suite, Floor, Unit)</label>
                <input type="text" id="address-line2" class="form-control" placeholder="Suite 200, Ground Floor (Optional)">
              </div>

              <div style="display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 1.25rem;">
                <div class="form-group">
                  <label class="form-label required">City / Municipality</label>
                  <input type="text" id="city" class="form-control" required value="Civic Metro">
                </div>

                <div class="form-group">
                  <label class="form-label required">State / Province</label>
                  <input type="text" id="state" class="form-control" required value="Metropolitan State">
                </div>

                <div class="form-group">
                  <label class="form-label required">Postal Code</label>
                  <input type="text" id="postal-code" class="form-control" required placeholder="10001">
                </div>
              </div>

              <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem;">
                <div class="form-group">
                  <label class="form-label">Commercial Contact Email</label>
                  <input type="email" id="contact-email" class="form-control" placeholder="contact@company.com">
                </div>

                <div class="form-group">
                  <label class="form-label">Commercial Phone</label>
                  <input type="tel" id="contact-phone" class="form-control" placeholder="+1 (555) 000-0000">
                </div>
              </div>

              <div class="form-group">
                <label class="form-label">Description of Commercial Activities</label>
                <textarea id="description" class="form-control" placeholder="Summary of operations, products offered, and on-site machinery..."></textarea>
              </div>

              <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid var(--border-light);">
                <a href="/owner/businesses.html" class="btn btn-secondary">Cancel</a>
                <button type="submit" id="save-btn" class="btn btn-primary">
                  <span>Save Business Entity</span>
                  <span class="material-symbols-outlined" style="font-size: 18px;">check</span>
                </button>
              </div>
            </form>
          </div>
        </div>

      </main>
    </div>
  </div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/components.js"></script>
  <script>
    let editId = null;

    document.addEventListener('DOMContentLoaded', async () => {
      renderSidebar('businesses', 'owner');
      renderTopbar('Business Entity Profile');

      const params = new URLSearchParams(window.location.search);
      editId = params.get('id');

      await loadCategories();

      if (editId) {
        document.getElementById('page-heading').textContent = 'Edit Business Profile';
        document.getElementById('save-btn').querySelector('span').textContent = 'Update Business Entity';
        await loadExistingData(editId);
      }
    });

    async function loadCategories() {
      try {
        const res = await API.get('/business-categories');
        if (res.success) {
          const select = document.getElementById('category-id');
          res.data.forEach(c => {
            select.innerHTML += `<option value="${c.id}">${c.name}</option>`;
          });
        }
      } catch (err) {
        console.error('Error loading categories:', err);
      }
    }

    async function loadExistingData(id) {
      try {
        const res = await API.get(`/businesses/${id}`);
        if (res.success && res.data) {
          const b = res.data;
          document.getElementById('business-name').value = b.business_name || '';
          document.getElementById('category-id').value = b.category_id || '';
          document.getElementById('registration-number').value = b.registration_number || '';
          document.getElementById('address-line1').value = b.address_line1 || '';
          document.getElementById('address-line2').value = b.address_line2 || '';
          document.getElementById('city').value = b.city || '';
          document.getElementById('state').value = b.state || '';
          document.getElementById('postal-code').value = b.postal_code || '';
          document.getElementById('contact-email').value = b.contact_email || '';
          document.getElementById('contact-phone').value = b.contact_phone || '';
          document.getElementById('description').value = b.description || '';
        }
      } catch (err) {
        showToast('Failed to load business details: ' + err.message, 'error');
      }
    }

    async function handleSubmit(e) {
      e.preventDefault();
      const payload = {
        businessName: document.getElementById('business-name').value.trim(),
        categoryId: parseInt(document.getElementById('category-id').value, 10),
        registrationNumber: document.getElementById('registration-number').value.trim() || null,
        addressLine1: document.getElementById('address-line1').value.trim(),
        addressLine2: document.getElementById('address-line2').value.trim() || null,
        city: document.getElementById('city').value.trim(),
        state: document.getElementById('state').value.trim(),
        postalCode: document.getElementById('postal-code').value.trim(),
        contactEmail: document.getElementById('contact-email').value.trim() || null,
        contactPhone: document.getElementById('contact-phone').value.trim() || null,
        description: document.getElementById('description').value.trim() || null
      };

      try {
        if (editId) {
          await API.put(`/businesses/${editId}`, payload);
          showToast('Business profile updated successfully!', 'success');
        } else {
          await API.post('/businesses', payload);
          showToast('Business entity registered successfully!', 'success');
        }
        setTimeout(() => {
          window.location.href = '/owner/businesses.html';
        }, 500);
      } catch (err) {
        showToast(err.message || 'Error saving business entity.', 'error');
      }
    }
  </script>
</body>
</html>
