<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Businesses — BizPermit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"><link rel="stylesheet" href="/assets/css/theme.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"><link rel="stylesheet" href="/assets/css/global.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"><link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/animations.css">
</head>
<body>

  <div class="dashboard-wrapper">
    <aside id="dashboard-sidebar" class="dashboard-sidebar"></aside>

    <div class="dashboard-main">
      <header id="dashboard-topbar" class="dashboard-topbar"></header>

      <main class="dashboard-content">
        
        <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 1.5rem; margin-bottom: 2rem;">
          <div>
            <h1 style="font-size: 2rem; margin-bottom: 0.25rem;">My Business Entities</h1>
            <p>Manage your registered commercial establishments, locations, and sector classifications.</p>
          </div>
          <a href="/owner/business-form.html" class="btn btn-primary" style="display:flex;align-items:center;gap:6px;">
            <span class="material-symbols-outlined" style="font-size: 18px;">add_business</span>
            <span>Register New Business</span>
          </a>
        </div>

        <!-- Filter Toolbar -->
        <div class="card" style="margin-bottom: 2rem; padding: 1.25rem;">
          <div style="display: grid; grid-template-columns: 2fr 1fr auto; gap: 1rem; align-items: center;" class="biz-filter-grid">
            <div style="position: relative; display: flex; align-items: center;">
              <span class="material-symbols-outlined" style="position: absolute; left: 12px; color: var(--text-muted); font-size: 18px;">search</span>
              <input type="text" id="biz-search" oninput="loadBusinesses()" class="form-control" style="padding-left: 38px;" placeholder="Search by business name or registration number...">
            </div>

            <select id="biz-category-filter" onchange="loadBusinesses()" class="form-select">
              <option value="">All Sectors</option>
            </select>

            <button onclick="loadBusinesses()" class="btn btn-secondary" title="Refresh">
              <span class="material-symbols-outlined" style="font-size: 18px;">refresh</span>
            </button>
          </div>
        </div>

        <!-- Businesses Grid -->
        <div id="biz-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 1.5rem;">
          <div style="grid-column: 1 / -1; padding: 3rem; text-align: center; color: var(--text-muted);">Loading businesses...</div>
        </div>

      </main>
    </div>
  </div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/components.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      renderSidebar('businesses', 'owner');
      renderTopbar('Registered Businesses');
      await loadCategories();
      await loadBusinesses();
    });

    async function loadCategories() {
      try {
        const res = await API.get('/business-categories');
        if (res.success) {
          const select = document.getElementById('biz-category-filter');
          res.data.forEach(c => {
            select.innerHTML += `<option value="${c.id}">${c.name}</option>`;
          });
        }
      } catch (err) {
        console.error('Failed to load categories:', err);
      }
    }

    async function loadBusinesses() {
      const grid = document.getElementById('biz-grid');
      const search = document.getElementById('biz-search').value.trim();
      const categoryId = document.getElementById('biz-category-filter').value;

      const params = {};
      if (search) params.search = search;
      if (categoryId) params.categoryId = categoryId;

      try {
        const res = await API.get('/businesses', params);
        if (res.success && res.data) {
          renderBusinesses(res.data);
        }
      } catch (err) {
        grid.innerHTML = `<div style="grid-column:1/-1;padding:2rem;text-align:center;color:var(--state-error);">Failed to load businesses: ${err.message}</div>`;
      }
    }

    function renderBusinesses(list) {
      const grid = document.getElementById('biz-grid');
      if (list.length === 0) {
        grid.innerHTML = `
          <div style="grid-column: 1 / -1; padding: 4rem 2rem; text-align: center; background: #fff; border-radius: var(--radius-xl); border: 1px dashed var(--border-default);">
            <span class="material-symbols-outlined" style="font-size: 48px; color: var(--text-muted); margin-bottom: 1rem;">store</span>
            <h3>No businesses found</h3>
            <p style="margin-top: 0.5rem; margin-bottom: 1.5rem;">Add your first physical commercial establishment to apply for permits.</p>
            <a href="/owner/business-form.html" class="btn btn-primary">Add Business Profile</a>
          </div>
        `;
        return;
      }

      grid.innerHTML = list.map(b => `
        <div class="card" style="display: flex; flex-direction: column; justify-content: space-between;">
          <div>
            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem;">
              <span class="badge badge-draft" style="font-size: 0.7rem; font-weight: 700;">${b.category_name}</span>
              ${b.registration_number ? `<span style="font-size: 0.75rem; font-family: var(--font-heading); color: var(--text-muted); font-weight: 600;">${b.registration_number}</span>` : ''}
            </div>

            <h3 style="font-size: 1.25rem; margin-bottom: 0.5rem;">${b.business_name}</h3>
            
            <div style="display: flex; align-items: flex-start; gap: 6px; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.5rem;">
              <span class="material-symbols-outlined" style="font-size: 16px; margin-top: 2px;">location_on</span>
              <span>${b.address_line1}${b.address_line2 ? ', ' + b.address_line2 : ''}, ${b.city}, ${b.state} ${b.postal_code}</span>
            </div>

            ${b.contact_email ? `
              <div style="display: flex; align-items: center; gap: 6px; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.25rem;">
                <span class="material-symbols-outlined" style="font-size: 14px;">mail</span>
                <span>${b.contact_email}</span>
              </div>
            ` : ''}

            <p style="font-size: 0.85rem; line-height: 1.5; margin-top: 0.75rem; color: var(--text-secondary);">
              ${b.description || 'Commercial premises operational profile.'}
            </p>
          </div>

          <div style="margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--border-light);">
            <div style="display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 1rem;">
              <span>Filings: <strong>${b.applications_count || 0}</strong></span>
              <span>Active Permits: <strong>${b.active_licenses_count || 0}</strong></span>
            </div>

            <div style="display: flex; gap: 8px;">
              <a href="/owner/business-form.html?id=${b.id}" class="btn btn-secondary btn-sm" style="flex: 1;">
                <span class="material-symbols-outlined" style="font-size: 14px;">edit</span>
                <span>Edit</span>
              </a>
              <a href="/owner/apply.html?businessId=${b.id}" class="btn btn-primary btn-sm" style="flex: 1;">
                <span class="material-symbols-outlined" style="font-size: 14px;">assignment_add</span>
                <span>Apply Permit</span>
              </a>
            </div>
          </div>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
