<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assigned Applications — BizPermit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/theme.css">
  <link rel="stylesheet" href="/assets/css/global.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/animations.css">
</head>
<body>
  <div class="dashboard-wrapper">
    <aside id="dashboard-sidebar" class="dashboard-sidebar"></aside>
    <div class="dashboard-main">
      <header id="dashboard-topbar" class="dashboard-topbar"></header>
      <main class="dashboard-content">
        <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:1rem;margin-bottom:2rem;">
          <div>
            <span style="font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--text-muted);">Officer Queue</span>
            <h1 style="font-size:1.875rem;margin-top:0.25rem;">Assigned Applications</h1>
            <p style="color:var(--text-secondary);">Applications requiring your review or action.</p>
          </div>
        </div>

        <!-- Filters -->
        <div class="card" style="padding:1.25rem 1.5rem;margin-bottom:1.5rem;">
          <div style="display:flex;flex-wrap:wrap;gap:1rem;align-items:center;">
            <div style="flex:1;min-width:220px;position:relative;">
              <span class="material-symbols-outlined" style="position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:18px;color:var(--text-muted);">search</span>
              <input id="app-search" type="text" placeholder="Search application number or business..." class="form-control" style="padding-left:2.5rem;">
            </div>
            <select id="status-filter" class="form-control" style="max-width:200px;">
              <option value="">All Statuses</option>
              <option value="SUBMITTED">Submitted</option>
              <option value="UNDER_REVIEW">Under Review</option>
              <option value="CORRECTION_REQUIRED">Correction Required</option>
              <option value="INSPECTION_REQUIRED">Inspection Required</option>
              <option value="APPROVED">Approved</option>
              <option value="REJECTED">Rejected</option>
            </select>
            <select id="sort-filter" class="form-control" style="max-width:160px;">
              <option value="newest">Newest First</option>
              <option value="oldest">Oldest First</option>
            </select>
          </div>
        </div>

        <div class="card">
          <div id="app-loading" style="padding:3rem;">
            <div style="height:50px;border-radius:6px;background:var(--bg-secondary);animation:pulse 1.5s infinite;margin-bottom:0.75rem;"></div>
            <div style="height:50px;border-radius:6px;background:var(--bg-secondary);animation:pulse 1.5s infinite;margin-bottom:0.75rem;"></div>
            <div style="height:50px;border-radius:6px;background:var(--bg-secondary);animation:pulse 1.5s infinite;"></div>
          </div>
          <div id="app-empty" style="display:none;padding:4rem;text-align:center;">
            <span class="material-symbols-outlined" style="font-size:48px;color:var(--text-muted);display:block;margin-bottom:1rem;">assignment_turned_in</span>
            <h3 style="font-size:1.1rem;margin-bottom:0.5rem;">No applications found</h3>
            <p style="color:var(--text-secondary);">No applications match the current filters.</p>
          </div>
          <div id="app-table-wrap" style="display:none;overflow-x:auto;">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Application</th><th>Business</th><th>License Type</th><th>Submitted</th><th>Status</th><th>Priority</th><th>Action</th>
                </tr>
              </thead>
              <tbody id="app-tbody"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/components.js"></script>
  <script>
    let allApps = [];
    document.addEventListener('DOMContentLoaded', async () => {
      await requireAuth(['OFFICER','INSPECTOR','ADMIN']);
      const session = getSession();
      const role = session?.user?.roles?.[0] || session?.user?.role || 'OFFICER';
      renderSidebar('assigned', role);
      renderTopbar();

      const params = new URLSearchParams(window.location.search);
      const initStatus = params.get('status');
      if (initStatus) document.getElementById('status-filter').value = initStatus;

      await loadApps();
      document.getElementById('app-search').addEventListener('input', applyFilters);
      document.getElementById('status-filter').addEventListener('change', applyFilters);
      document.getElementById('sort-filter').addEventListener('change', applyFilters);
    });

    async function loadApps() {
      try {
        const res = await api.get('/api/staff/assigned-applications');
        allApps = res.success ? (res.data || []) : [];
        document.getElementById('app-loading').style.display = 'none';
        applyFilters();
      } catch(e) {
        document.getElementById('app-loading').style.display = 'none';
        document.getElementById('app-empty').style.display = 'block';
      }
    }

    function applyFilters() {
      const search = document.getElementById('app-search').value.toLowerCase();
      const status = document.getElementById('status-filter').value;
      const sort = document.getElementById('sort-filter').value;
      let filtered = allApps.filter(a => {
        const an = (a.application_number||'').toLowerCase();
        const bn = (a.business_name||'').toLowerCase();
        const lt = (a.license_type_name||'').toLowerCase();
        return (!search || an.includes(search) || bn.includes(search) || lt.includes(search))
          && (!status || a.status === status);
      });
      if (sort === 'oldest') filtered.sort((a,b) => new Date(a.submitted_at) - new Date(b.submitted_at));
      else filtered.sort((a,b) => new Date(b.submitted_at||b.created_at) - new Date(a.submitted_at||a.created_at));
      renderTable(filtered);
    }

    const stBadge = {
      SUBMITTED:'<span class="badge badge-warning">Submitted</span>',
      UNDER_REVIEW:'<span class="badge badge-warning">Under Review</span>',
      CORRECTION_REQUIRED:'<span class="badge badge-error">Correction Needed</span>',
      INSPECTION_REQUIRED:'<span class="badge" style="background:#f3e8ff;color:#7c3aed;">Inspection</span>',
      APPROVED:'<span class="badge badge-success">Approved</span>',
      REJECTED:'<span class="badge badge-error">Rejected</span>',
      LICENSE_ISSUED:'<span class="badge badge-success">License Issued</span>'
    };

    function renderTable(apps) {
      if (!apps.length) {
        document.getElementById('app-empty').style.display = 'block';
        document.getElementById('app-table-wrap').style.display = 'none';
        return;
      }
      document.getElementById('app-empty').style.display = 'none';
      document.getElementById('app-table-wrap').style.display = 'block';
      document.getElementById('app-tbody').innerHTML = apps.map(a => {
        const daysSince = a.submitted_at ? Math.floor((new Date()-new Date(a.submitted_at))/(1000*60*60*24)) : 0;
        const priority = daysSince > 7 ? '<span style="font-size:0.7rem;font-weight:700;color:var(--state-error);text-transform:uppercase;">HIGH</span>' : daysSince > 3 ? '<span style="font-size:0.7rem;font-weight:700;color:var(--state-warning);text-transform:uppercase;">MEDIUM</span>' : '<span style="font-size:0.7rem;font-weight:700;color:var(--state-success);text-transform:uppercase;">LOW</span>';
        return `<tr>
          <td><div style="font-weight:700;font-size:0.875rem;">${a.application_number||'—'}</div><div style="font-size:0.7rem;color:var(--text-muted);">${a.application_type||'NEW'}</div></td>
          <td><div style="font-size:0.85rem;font-weight:600;">${a.business_name||'—'}</div></td>
          <td><div style="font-size:0.8rem;">${a.license_type_name||'—'}</div></td>
          <td style="font-size:0.8rem;">${a.submitted_at ? new Date(a.submitted_at).toLocaleDateString('en-IN') : '—'}<div style="font-size:0.7rem;color:var(--text-muted);">${daysSince} days ago</div></td>
          <td>${stBadge[a.status]||('<span class="badge">'+a.status+'</span>')}</td>
          <td>${priority}</td>
          <td><a href="/staff/review.html?id=${a.id}" class="btn btn-primary btn-sm">Review</a></td>
        </tr>`;
      }).join('');
    }
  </script>
</body>
</html>
