<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — BizPermit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"><link rel="stylesheet" href="/assets/css/theme.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"><link rel="stylesheet" href="/assets/css/global.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"><link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/animations.css">
</head>
<body style="background-color: var(--bg-secondary); min-height: 100vh; display: flex; flex-direction: column;">

  <header id="public-header" class="public-header"></header>

  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 3rem 1rem;">
    <div style="width: 100%; max-width: 460px;">
      
      <div class="card" style="padding: 2.5rem 2rem; border-radius: var(--radius-xl); box-shadow: var(--shadow-elevated);">
        
        <div style="text-align: center; margin-bottom: 2rem;">
          <div class="brand-icon" style="margin: 0 auto 1rem; width: 44px; height: 44px; border-radius: 12px;">
            <span class="material-symbols-outlined" style="font-size: 26px;">lock_reset</span>
          </div>
          <h2 style="font-size: 1.75rem; margin-bottom: 0.35rem;">Reset Account Password</h2>
          <p style="font-size: 0.85rem;">Single-use verification token challenge backed by Redis</p>
        </div>

        <div id="msg-box" style="display: none; padding: 0.85rem 1rem; border-radius: var(--radius-md); font-size: 0.85rem; margin-bottom: 1.5rem;"></div>

        <!-- Step 1: Request Code -->
        <div id="step-request">
          <form onsubmit="handleRequestCode(event)">
            <div class="form-group">
              <label class="form-label required">Registered Email Address</label>
              <input type="email" id="req-email" class="form-control" required placeholder="name@domain.com">
              <span class="form-helper">A 5-minute single-use OTP will be stored in Redis.</span>
            </div>

            <button type="submit" id="btn-request" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
              <span>Dispatch Verification Code</span>
              <span class="material-symbols-outlined" style="font-size: 18px;">send</span>
            </button>
          </form>
        </div>

        <!-- Step 2: Confirm OTP & New Password -->
        <div id="step-confirm" style="display: none;">
          <form onsubmit="handleResetPassword(event)">
            <div class="form-group">
              <label class="form-label required">Verification Code (OTP)</label>
              <input type="text" id="verify-code" class="form-control" required placeholder="6-digit verification code">
              <span id="demo-code-hint" style="font-size: 0.75rem; color: var(--accent-teal); font-weight: 600; display: block; margin-top: 4px;"></span>
            </div>

            <div class="form-group">
              <label class="form-label required">New Password</label>
              <input type="password" id="new-password" class="form-control" required placeholder="Min 6 characters">
            </div>

            <div class="form-group">
              <label class="form-label required">Confirm New Password</label>
              <input type="password" id="confirm-password" class="form-control" required placeholder="Re-enter new password">
            </div>

            <button type="submit" id="btn-reset" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
              <span>Update Password</span>
              <span class="material-symbols-outlined" style="font-size: 18px;">check</span>
            </button>
          </form>
        </div>

        <div style="margin-top: 1.75rem; text-align: center; font-size: 0.85rem; color: var(--text-secondary);">
          Remembered credentials? 
          <a href="/login.html" style="color: var(--text-primary); font-weight: 700; text-decoration: underline;">Return to Sign In</a>
        </div>

      </div>

    </div>
  </main>

  <footer id="public-footer" class="public-footer"></footer>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/components.js"></script>
  <script>
    let activeEmail = '';

    document.addEventListener('DOMContentLoaded', () => {
      renderPublicHeader('signin');
      renderPublicFooter();
    });

    async function handleRequestCode(e) {
      e.preventDefault();
      const email = document.getElementById('req-email').value.trim();
      const msgBox = document.getElementById('msg-box');
      const btn = document.getElementById('btn-request');

      btn.disabled = true;
      btn.innerHTML = '<span>Processing...</span>';

      try {
        const res = await API.post('/auth/forgot-password', { email });
        activeEmail = email;
        
        msgBox.className = 'card';
        msgBox.style.display = 'block';
        msgBox.style.backgroundColor = 'var(--state-success-bg)';
        msgBox.style.borderColor = 'var(--state-success-border)';
        msgBox.style.color = 'var(--state-success)';
        msgBox.innerHTML = `<strong>Challenge Code Dispatched!</strong><br>${res.data.message}`;

        if (res.data.challengeCode) {
          document.getElementById('verify-code').value = res.data.challengeCode;
          document.getElementById('demo-code-hint').textContent = `Demo verification token prefilled: ${res.data.challengeCode} (Stored in Redis)`;
        }

        document.getElementById('step-request').style.display = 'none';
        document.getElementById('step-confirm').style.display = 'block';

      } catch (err) {
        msgBox.style.display = 'block';
        msgBox.style.backgroundColor = 'var(--state-error-bg)';
        msgBox.style.borderColor = 'var(--state-error-border)';
        msgBox.style.color = 'var(--state-error)';
        msgBox.textContent = err.message || 'Error generating challenge code.';
        btn.disabled = false;
        btn.innerHTML = '<span>Dispatch Verification Code</span><span class="material-symbols-outlined" style="font-size: 18px;">send</span>';
      }
    }

    async function handleResetPassword(e) {
      e.preventDefault();
      const code = document.getElementById('verify-code').value.trim();
      const newPassword = document.getElementById('new-password').value;
      const confirmPassword = document.getElementById('confirm-password').value;
      const msgBox = document.getElementById('msg-box');
      const btn = document.getElementById('btn-reset');

      if (newPassword !== confirmPassword) {
        msgBox.style.display = 'block';
        msgBox.style.backgroundColor = 'var(--state-error-bg)';
        msgBox.style.borderColor = 'var(--state-error-border)';
        msgBox.style.color = 'var(--state-error)';
        msgBox.textContent = 'Passwords do not match.';
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span>Updating...</span>';

      try {
        const res = await API.post('/auth/reset-password', {
          email: activeEmail,
          code,
          newPassword
        });

        showToast(res.data.message || 'Password updated successfully!', 'success');
        setTimeout(() => {
          window.location.href = '/login.html';
        }, 1000);

      } catch (err) {
        msgBox.style.display = 'block';
        msgBox.style.backgroundColor = 'var(--state-error-bg)';
        msgBox.style.borderColor = 'var(--state-error-border)';
        msgBox.style.color = 'var(--state-error)';
        msgBox.textContent = err.message || 'Failed to reset password.';
        btn.disabled = false;
        btn.innerHTML = '<span>Update Password</span><span class="material-symbols-outlined" style="font-size: 18px;">check</span>';
      }
    }
  </script>
</body>
</html>
